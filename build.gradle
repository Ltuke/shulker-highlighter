plugins {
    // Non-obfuscated Minecraft 26.3 Loom, not the legacy fabric-loom ID.
    id 'net.fabricmc.fabric-loom' version '1.18.2'
}

version = '0.1.1'
group = 'com.example'

base {
    archivesName = 'shulker-highlighter'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    // Official Modrinth Maven coordinates for Mod Menu 21.0.0 (26.3).
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    // NO mappings entry for unobfuscated Minecraft 26.3.
    // Modern Fabric Loom uses Gradle implementation/compileOnly here.
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.163.0+26.3'
    compileOnly 'maven.modrinth:mOgUt4GM:kyy7dbrZ'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
